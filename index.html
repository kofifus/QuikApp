<!DOCTYPE html>
<html lang="en">
<head>
<style>
  .rootapp { width:90%; border: solid; margin: 10px; padding: 10px; }
  .childapp { width: 100px; border: solid; margin: 10px; padding: 10px; }
</style>

<!-- <script src="https://cdn.jsdelivr.net/gh/kofifus/QuikApp@latest/quikapp.js"></script> -->
<script src="quikapp.js"></script>

</head>

<body>
<root- id="R0" class="rootapp"></root->

<script>

const getID = el => el.getAttribute('id')
const byID = id => document.getElementById(id)

// polls until DOM node is committed in the next render frame
const waitElement = (id, done) => {
  let elem = byID(id)
  if (!!elem) return done(elem)
  requestAnimationFrame(() => waitElement(id, done))
}
const waitElementGone = (id, done) => {
  let elem = byID(id)
  if (!!!elem) return done(id)
  requestAnimationFrame(() => waitElementGone(id, done))
}

let rootMountFn = window.quikApp('root-', ({ hostNode, H }) => {

  let hostId = getID(hostNode)
  let rootOn = false
  let timerOn = false
  let watchIds = []

  const AddSW = () => {
    let slot = watchIds.indexOf(null)
    if (slot == -1) slot = watchIds.length
    let id = `${hostId}/W${slot}`
    watchIds[slot] = id

    waitElement(watchIds[slot], elem => {
      // establishe bidirectional atom subscriptions between neighbors
      let prev = elem.previousSibling
      if (prev?.tagName != 'STOPWATCH-') prev = undefined 
      elem.subscribeToSibling('left')
      prev?.subscribeToSibling('right')
      elem.subscribeToSibling('right')
    })
  }

  const SetValue = (id, v) => {
    let sw = byID(id)
    if (!sw) return
    alert(`${hostId} msg: Setting Stopwatch ${id} ${sw.value} -> ${v}`)
    sw.SetValue(v)
  }

  const htmlStopwatches = () =>
    watchIds
      .filter(id => id != null)
      .map(id => H`<stopwatch- id="${id}" class="childapp"></stopwatch->`)

  return {
    view: () => H`
      ${hostId}\xa0\xa0\xa0\xa0
      <button onclick=${AddSW}>+</button>
      <br/><br/>
      <button ${!watchIds[0] ? 'disabled' : ''}  onclick=${[SetValue, `${hostId}/W0`, 100]}>Stopwatch0 set</button>
      <br/>
      <label><input type="checkbox" onchange=${() => { rootOn = !rootOn }} />Add Root</label>  
      <label><input type="checkbox" style="margin-left:10px" onchange=${() => { timerOn = !timerOn }}/>Add Timer</label>
      <br/><br/>
      ${htmlStopwatches()}
      ${rootOn ? H`<root- class="rootapp" id="${hostId}/R"></root->` : ''}
      ${timerOn ? H`<timer- class="rootapp" id="${hostId}t" style="display:inline-block"></timer->` : ''}
    `,

    methods: {
      SWclosed: el => {
        let slot = watchIds.indexOf(el.id)
        watchIds[slot] = null
        
        let prev = el.previousSibling, next = el.nextSibling
        if (prev?.tagName != 'STOPWATCH-') prev = undefined 
        
        waitElementGone(el.id, _ => {
          // re-establishes adjacency after DOM removal shifts sibling chain
          prev?.subscribeToSibling('right')
          next?.subscribeToSibling('left')
        })
      }
    },

    destroy: () => { alert(`${hostId} msg: destroyed`) }
  }
})


window.quikApp('stopwatch-', ({ hostNode, parentNode, H, dispatchFn, atomSubscribeFn }) => {
  let hostId = getID(hostNode)

  let value = 0
  let interValId = undefined

  const ToggleWatch = ev => {
    let freq = 200
    let FW = () => { value += freq }

    if (interValId) {
      clearInterval(interValId)
      interValId = undefined
    } else {
      interValId = setInterval(() => { dispatchFn(FW) }, freq)
    }
  }

  // a dispatch hook that logs value changes
  const logValue = (() => {
    let prevValue

    return [
      () => { prevValue = value },
      () => { if (value!=prevValue) console.log(`${prevValue} -> ${value}`) }
    ]
  })()

  // subsribe to an atom returning the value of the left/right stopwatch sibling
  let leftSiblingAtom;
  let rightSiblingAtom;

  return {
    view: () => H`
      ${hostId}<input type="button" value="x" style="float: right;" onclick=${[parentNode.SWclosed, hostNode]} />
      <br/><br/><div class=${({ red: value > 1000 })}>${value}${value > 1000 && ' BIG'}</div>
      <br/>left:${leftSiblingAtom?.()}
      <br/>right:${rightSiblingAtom?.()}
      <br/><br/><button onclick=${ToggleWatch} style="color:red">start/stop</button>
    `,

    properties: {
      // external snapshot API updated per dispatch cycle
      value: () => value
    },
      
    methods: {
      SetValue: v => { value = v },

      subscribeToSibling: side => {
        let sibling = side == 'left' ? hostNode.previousSibling : hostNode.nextSibling
        if (sibling?.tagName != 'STOPWATCH-') return
        let atom = atomSubscribeFn(sibling.atoms.value)
        if (side == 'left') leftSiblingAtom?.unsubscribe(); else rightSiblingAtom?.unsubscribe() // cleanup, this is optional otherwise GC will do it
        if (side == 'left') leftSiblingAtom = atom; else rightSiblingAtom=atom 
      },
    },

    wrapper: logValue,

    atoms: {
      // publishes state for cross-app subscription 
      value: () => value
    },
    
    destroy: () => { alert(`stopwatch ${hostId} destroyed`); clearInterval(interValId) }
  }
})

window.quikApp('timer-', false, hostNode => {
  hostNode.innerHTML = '<div>Timer: <span id="timerVal"></span></div>'
  let span = document.getElementById('timerVal')

  let interval
  let counter = 0;
  interval = setInterval(() => { span.innerText = ++counter }, 500)

  // return the unmount function
  return hostNode => {
    interval = clearInterval(interval)
    alert('timer- destroyed')
  }
})


rootMountFn(byID('R0')) // mount root

</script>
</body>
</html>
